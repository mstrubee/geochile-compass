# ═══════════════════════════════════════════════════════════════════════════
# sync_comercio_osm.yml  (ahora ejecuta el ETL de Google Places)
#
# Nombre de archivo conservado para compatibilidad con la Edge Function
# "trigger-sync" que despacha este workflow por nombre.
#
# Ejecución: domingos a las 03:00 UTC (00:00 Chile hora de verano)
# Manual:    Actions → "Sync Red Comercial Google" → Run workflow
#
# Secrets requeridos en GitHub → Settings → Secrets:
#   SUPABASE_URL         → https://tcmyidycqdrrtwuaovbk.supabase.co
#   SYNC_API_TOKEN       → token compartido con la Edge Function
#   VITE_GOOGLE_MAPS_KEY → clave de Google Maps Platform (Places API habilitada)
# ═══════════════════════════════════════════════════════════════════════════

name: Sync Red Comercial Google

on:
  schedule:
    - cron: "0 3 1 */3 *"  # Cada 3 meses (trimestral)

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo extraer y guardar CSV, sin escribir en DB"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  sync:
    name: "Sync POIs Google Places → Supabase"
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "etl/comercio_google/requirements.txt"

      - name: Install dependencies
        run: pip install -r etl/comercio_google/requirements.txt

      # ── Sincronización principal ───────────────────────────────────────────
      - name: Run Google Places sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SYNC_API_TOKEN:       ${{ secrets.SYNC_API_TOKEN }}
          # Clave sin restricción de HTTP Referrer (uso servidor/ETL)
          GOOGLE_MAPS_API_KEY:  ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          ARGS="--verbose"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m etl.comercio_google.run_sync $ARGS

      # ── Subir CSV de diagnóstico como artefacto ────────────────────────────
      - name: Upload diagnostic CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comercio-google-extract-${{ github.run_number }}
          path: etl/output/comercio_google_extract.csv
          retention-days: 14
          if-no-files-found: ignore

      # ── Notificar en caso de error ─────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::La sincronización de Red Comercial Google falló. Revisa los logs del workflow."
